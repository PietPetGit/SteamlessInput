<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="SteamlessInput — an open-source, easier-to-use Steam Input">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="55%" stop-color="#08152C"/>
      <stop offset="100%" stop-color="#04263C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0A1A38"/>
      <stop offset="100%" stop-color="#0A7FB0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#9FE3FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FD8FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .pulse { animation: p 3.2s ease-in-out infinite; }
      @keyframes p { 0%,100% { opacity:.35 } 50% { opacity:.85 } }
      .float { animation: f 6s ease-in-out infinite; }
      @keyframes f { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)"/>
  <ellipse cx="215" cy="205" rx="300" ry="230" fill="url(#glow)" class="pulse"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.28"/>

  <!-- logo mark -->
  <g transform="translate(96,118)"><g class="float">
    <circle cx="90" cy="90" r="90" fill="url(#mark)"/>
    <circle cx="90" cy="90" r="88" fill="none" stroke="#9FE3FF" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="translate(90,90) scale(0.62) translate(-90,-90)">
      <mask id="hpad" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="180">
        <path fill="#FFFFFF" d="M62 44h56a10 10 0 0 1 8 4h18a10 10 0 0 1 8-4h6c9 0 15 6 18 15 8 24 14 49 15 72 1 16-7 27-20 27-9 0-15-5-19-15l-5-13a12 12 0 0 0-11-8H74a12 12 0 0 0-11 8l-5 13c-4 10-10 15-19 15-13 0-21-11-20-27 1-23 7-48 15-72 3-9 9-15 18-15z"/>
        <g fill="#000000">
          <rect x="59" y="60" width="8" height="26" rx="2"/>
          <rect x="50" y="69" width="26" height="8" rx="2"/>
          <circle cx="122" cy="62" r="5"/><circle cx="136" cy="72" r="5"/><circle cx="108" cy="72" r="5"/><circle cx="122" cy="82" r="5"/>
          <rect x="66" y="104" width="24" height="24" rx="6" transform="rotate(-10 78 116)"/>
          <rect x="104" y="104" width="24" height="24" rx="6" transform="rotate(10 116 116)"/>
        </g>
      </mask>
      <rect x="0" y="0" width="180" height="180" fill="#FFFFFF" mask="url(#hpad)"/>
    </g>
  </g></g>

  <!-- wordmark -->
  <text class="t" x="316" y="152" font-size="66" font-weight="700" fill="url(#word)" letter-spacing="-1.5">SteamlessInput</text>
  <text class="t" x="320" y="196" font-size="23" fill="#B9CBE4">An open-source, easier-to-use Steam Input.</text>
  <text class="t" x="320" y="230" font-size="23" fill="#7FD3F7">Any gamepad becomes a Steam Controller — without Steam running.</text>

  <!-- pills -->
  <g class="t" font-size="15" font-weight="600">
    <g transform="translate(320,262)">
      <rect width="196" height="38" rx="19" fill="#0A7FB0" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="98" y="24" text-anchor="middle" fill="#BEE9FF">⌨  On-screen keyboard</text>
    </g>
    <g transform="translate(530,262)">
      <rect width="176" height="38" rx="19" fill="#0A7FB0" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="88" y="24" text-anchor="middle" fill="#BEE9FF">🖱  Desktop control</text>
    </g>
    <g transform="translate(720,262)">
      <rect width="182" height="38" rx="19" fill="#0A7FB0" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="91" y="24" text-anchor="middle" fill="#BEE9FF">🎮  Gamepad mode</text>
    </g>
    <g transform="translate(916,262)">
      <rect width="176" height="38" rx="19" fill="#0A7FB0" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="88" y="24" text-anchor="middle" fill="#BEE9FF">📺  Big Picture</text>
    </g>
  </g>

  <!-- stat strip -->
  <g class="t">
    <line x1="320" y1="330" x2="1184" y2="330" stroke="#38BDF8" stroke-opacity="0.22"/>
    <g text-anchor="start">
      <text x="320" y="368" font-size="26" font-weight="700" fill="#FFFFFF">Windows</text>
      <text x="320" y="392" font-size="14" fill="#8FA3BF">+ Linux (X11 / Wayland)</text>

      <text x="520" y="368" font-size="26" font-weight="700" fill="#FFFFFF">20+</text>
      <text x="520" y="392" font-size="14" fill="#8FA3BF">controllers supported</text>

      <text x="720" y="368" font-size="26" font-weight="700" fill="#FFFFFF">435</text>
      <text x="720" y="392" font-size="14" fill="#8FA3BF">Steam icons for menus</text>

      <text x="920" y="368" font-size="26" font-weight="700" fill="#FFFFFF">GPL-3.0</text>
      <text x="920" y="392" font-size="14" fill="#8FA3BF">free &amp; open source</text>

      <text x="1090" y="368" font-size="26" font-weight="700" fill="#FFFFFF">0</text>
      <text x="1090" y="392" font-size="14" fill="#8FA3BF">Steam required</text>
    </g>
  </g>
</svg>
