<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-label="Default controller keybinds in desktop mode">
  <defs>
    <linearGradient id="chbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/><stop offset="100%" stop-color="#051D33"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .a { font-size: 14.5px; fill: #DCE9F8; }
      .s { font-size: 12px; fill: #8FA3BF; }
      .btn { font-size: 12.5px; font-weight: 700; fill: #04121F; }
    </style>
  </defs>

  <rect width="880" height="620" rx="18" fill="url(#chbg)"/>
  <rect x="0.5" y="0.5" width="879" height="619" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>
  <text class="t" x="40" y="50" font-size="25" font-weight="700" fill="#FFFFFF">Desktop-mode cheat sheet</text>
  <text class="t" x="40" y="76" font-size="14" fill="#8FA3BF">These are the defaults — every one of them is rebindable in the GUI.</text>

  <g class="t">
    <!-- row helper: chip(s) then text -->
    <g transform="translate(40,110)">
      <circle cx="18" cy="0" r="16" fill="#E6EDF7"/><text class="btn" x="18" y="5" text-anchor="middle">X</text>
      <text class="a" x="200" y="5">Open the on-screen keyboard</text>
      <text class="s" x="200" y="24">or Windows + Ctrl + O</text>
    </g>

    <g transform="translate(40,172)">
      <rect x="0" y="-16" width="66" height="32" rx="16" fill="#E6EDF7"/><text class="btn" x="33" y="5" text-anchor="middle">≡ hold</text>
      <text class="a" x="200" y="5">Switch between Desktop and Gamepad controls</text>
      <text class="s" x="200" y="24">hold ≡ by itself ~¾ s — works in both modes, on every pad, nothing to bind first</text>
    </g>

    <g transform="translate(40,234)">
      <rect x="0" y="-16" width="52" height="32" rx="16" fill="#7FD3F7"/><text class="btn" x="26" y="5" text-anchor="middle">STEAM</text>
      <text class="a" x="66" y="5" fill="#8FA3BF">+</text>
      <circle cx="96" cy="0" r="16" fill="#E6EDF7"/><text class="btn" x="96" y="5" text-anchor="middle">B</text>
      <text class="a" x="200" y="5">Force-shutdown the game</text>
    </g>

    <g transform="translate(40,284)">
      <rect x="0" y="-16" width="52" height="32" rx="16" fill="#7FD3F7"/><text class="btn" x="26" y="5" text-anchor="middle">STEAM</text>
      <text class="a" x="66" y="5" fill="#8FA3BF">+</text>
      <circle cx="96" cy="0" r="16" fill="#E6EDF7"/><text class="btn" x="96" y="5" text-anchor="middle">Y</text>
      <text class="a" x="200" y="5">Turn the controller off</text>
    </g>

    <g transform="translate(40,334)">
      <rect x="0" y="-16" width="52" height="32" rx="16" fill="#7FD3F7"/><text class="btn" x="26" y="5" text-anchor="middle">STEAM</text>
      <text class="a" x="66" y="5" fill="#8FA3BF">+</text>
      <rect x="80" y="-16" width="32" height="32" rx="16" fill="#E6EDF7"/><text class="btn" x="96" y="5" text-anchor="middle">≡</text>
      <text class="a" x="200" y="5">Alt+Tab</text>
      <text class="s" x="200" y="24">hold STEAM to keep the switcher open; each VIEW press advances one slot</text>
    </g>

    <g transform="translate(40,396)">
      <rect x="0" y="-16" width="52" height="32" rx="16" fill="#7FD3F7"/><text class="btn" x="26" y="5" text-anchor="middle">STEAM</text>
      <text class="a" x="66" y="5" fill="#8FA3BF">+</text>
      <rect x="80" y="-16" width="44" height="32" rx="10" fill="#E6EDF7"/><text class="btn" x="102" y="5" text-anchor="middle">R-PAD</text>
      <text class="a" x="200" y="5">Use the trackpad as a mouse while in gamepad mode</text>
    </g>

    <g transform="translate(40,446)">
      <rect x="0" y="-16" width="52" height="32" rx="16" fill="#7FD3F7"/><text class="btn" x="26" y="5" text-anchor="middle">STEAM</text>
      <text class="a" x="66" y="5" fill="#8FA3BF">+</text>
      <rect x="80" y="-16" width="60" height="32" rx="10" fill="#E6EDF7"/><text class="btn" x="110" y="5" text-anchor="middle">L-STICK</text>
      <text class="a" x="200" y="5">↑ ↓ volume (tap to step, hold to ramp) · ← → previous / next song</text>
    </g>

    <g transform="translate(40,496)">
      <rect x="0" y="-16" width="40" height="32" rx="10" fill="#E6EDF7"/><text class="btn" x="20" y="5" text-anchor="middle">L3</text>
      <text class="a" x="200" y="5">Middle click — e.g. open a link in a new tab, or close one</text>
      <text class="s" x="200" y="24">STEAM + L3 = play / pause</text>
    </g>

    <g transform="translate(40,558)">
      <rect x="0" y="-16" width="40" height="32" rx="10" fill="#E6EDF7"/><text class="btn" x="20" y="5" text-anchor="middle">L3</text>
      <text class="a" x="46" y="5" fill="#8FA3BF">+</text>
      <rect x="60" y="-16" width="40" height="32" rx="10" fill="#E6EDF7"/><text class="btn" x="80" y="5" text-anchor="middle">R3</text>
      <text class="a" x="200" y="5">While the keyboard is open: enable Gyro To Type, or recenter the pointer</text>
      <text class="s" x="200" y="24">no keybind needed — see Options → Keyboard → Gyro To Type</text>
    </g>
  </g>
</svg>
