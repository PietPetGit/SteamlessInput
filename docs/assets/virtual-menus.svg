<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440" role="img" aria-label="Virtual menus: radial, touch grid and hotbar menus on the trackpads">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/><stop offset="100%" stop-color="#06203A"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .b { font-size: 13px; fill: #9FB4CE; }
      .ic { font-size: 20px; }
      .sweep { transform-origin: 180px 250px; animation: sw 4s ease-in-out infinite; }
      @keyframes sw { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(120deg) } }
    </style>
  </defs>

  <rect width="1080" height="440" rx="18" fill="url(#mbg)"/>
  <rect x="0.5" y="0.5" width="1079" height="439" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>
  <text class="t" x="40" y="50" font-size="25" font-weight="700" fill="#FFFFFF">Virtual Menus</text>
  <text class="t" x="40" y="76" font-size="14" fill="#8FA3BF">Three menu shapes on the trackpads, with an editor, a live preview and 435 Steam icons.</text>

  <!-- radial -->
  <g>
    <text class="t h" x="120" y="120">Radial</text>
    <text class="t b" x="120" y="142">flick a direction, release</text>
    <circle cx="180" cy="250" r="96" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.3"/>
    <g fill="none" stroke="#38BDF8" stroke-opacity="0.25">
      <line x1="180" y1="154" x2="180" y2="346"/><line x1="84" y1="250" x2="276" y2="250"/>
      <line x1="112" y1="182" x2="248" y2="318"/><line x1="248" y1="182" x2="112" y2="318"/>
    </g>
    <g class="sweep">
      <path d="M180 250 L180 154 A96 96 0 0 1 248 182 Z" fill="#38BDF8" fill-opacity="0.28"/>
    </g>
    <circle cx="180" cy="250" r="30" fill="#0A1A38" stroke="#7FD3F7" stroke-opacity="0.6"/>
    <g class="t ic" text-anchor="middle" fill="#DCE9F8">
      <text x="180" y="186">🔊</text><text x="234" y="212">📋</text><text x="244" y="266">🔍</text>
      <text x="212" y="316">⏯</text><text x="152" y="322">🖥</text><text x="112" y="278">⌨</text>
      <text x="116" y="222">↩</text><text x="140" y="188">⭐</text>
    </g>
  </g>

  <!-- touch grid -->
  <g transform="translate(320,0)">
    <text class="t h" x="120" y="120">Touch menu</text>
    <text class="t b" x="120" y="142">tap a cell straight on the pad</text>
    <rect x="86" y="160" width="188" height="188" rx="16" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.3"/>
    <g fill="#16263F" stroke="#38BDF8" stroke-opacity="0.28">
      <rect x="100" y="174" width="52" height="52" rx="8"/><rect x="158" y="174" width="52" height="52" rx="8"/><rect x="216" y="174" width="44" height="52" rx="8"/>
      <rect x="100" y="232" width="52" height="52" rx="8"/>
      <rect x="216" y="232" width="44" height="52" rx="8"/>
      <rect x="100" y="290" width="52" height="44" rx="8"/><rect x="158" y="290" width="52" height="44" rx="8"/><rect x="216" y="290" width="44" height="44" rx="8"/>
    </g>
    <rect x="158" y="232" width="52" height="52" rx="8" fill="#0A7FB0" fill-opacity="0.55" stroke="#7FD3F7"/>
    <g class="t ic" text-anchor="middle" fill="#DCE9F8">
      <text x="126" y="207">🎮</text><text x="184" y="207">📺</text><text x="238" y="207">🔇</text>
      <text x="126" y="265">💤</text><text x="184" y="265">⌨</text><text x="238" y="265">🌐</text>
      <text x="126" y="320">⏹</text><text x="184" y="320">📷</text><text x="238" y="320">⚙</text>
    </g>
    <circle cx="184" cy="258" r="13" fill="#FFFFFF" fill-opacity="0.28"/>
  </g>

  <!-- hotbar -->
  <g transform="translate(640,0)">
    <text class="t h" x="100" y="120">Hotbar</text>
    <text class="t b" x="100" y="142">slide along, release to fire</text>
    <rect x="40" y="200" width="380" height="96" rx="16" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.3"/>
    <g fill="#16263F" stroke="#38BDF8" stroke-opacity="0.28">
      <rect x="58" y="220" width="56" height="56" rx="10"/>
      <rect x="122" y="220" width="56" height="56" rx="10"/>
      <rect x="250" y="220" width="56" height="56" rx="10"/>
      <rect x="314" y="220" width="56" height="56" rx="10"/>
    </g>
    <rect x="186" y="212" width="56" height="72" rx="12" fill="#0A7FB0" fill-opacity="0.55" stroke="#7FD3F7"/>
    <g class="t ic" text-anchor="middle" fill="#DCE9F8">
      <text x="86" y="255">🔉</text><text x="150" y="255">⏮</text><text x="214" y="257" font-size="24">⏯</text><text x="278" y="255">⏭</text><text x="342" y="255">🔊</text>
    </g>
    <text class="t b" x="230" y="322" text-anchor="middle" fill="#7FD3F7">Play / Pause</text>
    <text class="t b" x="40" y="372">Any menu item can fire a key, a mouse action,</text>
    <text class="t b" x="40" y="392">a gamepad button, a macro or a system command.</text>
  </g>

  <text class="t b" x="40" y="412">Advanced Presses put a second action on a long press, double press, soft pull or mode shift — Steam-Input-style.</text>
</svg>
