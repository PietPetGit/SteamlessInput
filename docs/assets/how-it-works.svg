<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="How SteamlessInput works: controllers feed a HID or SDL layer, the core translates them, and output goes to the on-screen keyboard, desktop input, a virtual Xbox pad and system automation">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/><stop offset="100%" stop-color="#052033"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A7FB0"/><stop offset="100%" stop-color="#0A1A38"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/>
    </marker>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .lbl { font-size: 15px; fill: #DCE9F8; }
      .sm { font-size: 12.5px; fill: #8FA3BF; }
      .cap { font-size: 13px; font-weight: 700; fill: #7FD3F7; letter-spacing: 1.4px; }
      .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28 } }
    </style>
  </defs>

  <rect width="1280" height="520" rx="18" fill="url(#hbg)"/>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>
  <text class="t" x="48" y="58" font-size="28" font-weight="700" fill="#FFFFFF">How it works</text>
  <text class="t" x="48" y="84" font-size="14.5" fill="#8FA3BF">Raw controller reports in, real Windows / Linux input out — Steam never enters the picture.</text>

  <!-- column captions -->
  <text class="t cap" x="48" y="126">YOUR CONTROLLER</text>
  <text class="t cap" x="404" y="126">READ LAYER</text>
  <text class="t cap" x="654" y="126">STEAMLESSINPUT</text>
  <text class="t cap" x="972" y="126">WHAT COMES OUT</text>

  <!-- inputs -->
  <g class="t">
    <g transform="translate(48,146)">
      <rect width="290" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">Steam Controller 2015 / 2026 · Deck</text>
      <text class="sm" x="18" y="46">trackpads · haptics · gyro · chords</text>
    </g>
    <g transform="translate(48,220)">
      <rect width="290" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">DualSense · DS4 · Switch Pro · Joy-Con</text>
      <text class="sm" x="18" y="46">gyro on every pad that has one</text>
    </g>
    <g transform="translate(48,294)">
      <rect width="290" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">Xbox · 8BitDo · GameCube · NSO</text>
      <text class="sm" x="18" y="46">and any other SDL gamepad</text>
    </g>
    <g transform="translate(48,368)">
      <rect width="290" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">ROG Ally · Legion Go · Claw · AYANEO</text>
      <text class="sm" x="18" y="46">handheld built-in pads</text>
    </g>
  </g>

  <!-- read layer -->
  <g class="t">
    <g transform="translate(392,176)">
      <rect width="180" height="86" rx="12" fill="#0A2B45" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text class="lbl" x="90" y="34" text-anchor="middle" font-weight="700">HID takeover</text>
      <text class="sm" x="90" y="56" text-anchor="middle">raw reports, full</text>
      <text class="sm" x="90" y="73" text-anchor="middle">trackpad + haptics</text>
    </g>
    <g transform="translate(392,312)">
      <rect width="180" height="86" rx="12" fill="#0A2B45" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text class="lbl" x="90" y="34" text-anchor="middle" font-weight="700">SDL3</text>
      <text class="sm" x="90" y="56" text-anchor="middle">everything else,</text>
      <text class="sm" x="90" y="73" text-anchor="middle">hotplug aware</text>
    </g>
  </g>

  <!-- core -->
  <g class="t" transform="translate(626,146)">
    <rect width="212" height="282" rx="16" fill="url(#core)" stroke="#7FD3F7" stroke-opacity="0.55"/>
    <text x="106" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Translation core</text>
    <line x1="26" y1="60" x2="186" y2="60" stroke="#9FE3FF" stroke-opacity="0.35"/>
    <text class="lbl" x="26" y="92">· remap &amp; chords</text>
    <text class="lbl" x="26" y="120">· advanced presses</text>
    <text class="lbl" x="26" y="148">· gestures &amp; gyro</text>
    <text class="lbl" x="26" y="176">· virtual menus</text>
    <text class="lbl" x="26" y="204">· profile slots</text>
    <text class="lbl" x="26" y="232">· focus detection</text>
    <text class="sm" x="26" y="260" fill="#BEE9FF">desktop ⇄ gamepad, automatic</text>
  </g>

  <!-- outputs -->
  <g class="t">
    <g transform="translate(892,146)">
      <rect width="340" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">⌨️  On-screen keyboard</text>
      <text class="sm" x="18" y="46">real keystrokes into any app, even the lock screen</text>
    </g>
    <g transform="translate(892,220)">
      <rect width="340" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">🖱️  Desktop pointer &amp; hotkeys</text>
      <text class="sm" x="18" y="46">mouse, scroll, media keys, volume, Alt+Tab, shutdown</text>
    </g>
    <g transform="translate(892,294)">
      <rect width="340" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">🎮  Virtual Xbox 360 pad</text>
      <text class="sm" x="18" y="46">ViGEmBus on Windows · uinput on Linux</text>
    </g>
    <g transform="translate(892,368)">
      <rect width="340" height="60" rx="12" fill="#12233F" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text class="lbl" x="18" y="27">📺  System &amp; Big Picture automation</text>
      <text class="sm" x="18" y="46">display, audio, HDR, Night Light, sleep — all reversible</text>
    </g>
  </g>

  <!-- wires -->
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrow)">
    <path class="flow" d="M338 176 C 366 176 366 205 386 210"/>
    <path class="flow" d="M338 250 C 366 250 366 232 386 226"/>
    <path class="flow" d="M338 324 C 366 324 366 348 386 352"/>
    <path class="flow" d="M338 398 C 366 398 366 372 386 366"/>
    <path class="flow" d="M572 219 C 600 219 600 250 620 258"/>
    <path class="flow" d="M572 355 C 600 355 600 300 620 292"/>
    <path class="flow" d="M838 250 C 866 250 866 176 886 176"/>
    <path class="flow" d="M838 262 C 866 262 866 250 886 250"/>
    <path class="flow" d="M838 274 C 866 274 866 324 886 324"/>
    <path class="flow" d="M838 286 C 866 286 866 398 886 398"/>
  </g>

  <!-- footer note -->
  <g class="t" transform="translate(48,452)">
    <rect width="1184" height="44" rx="10" fill="#0A7FB0" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text class="lbl" x="20" y="28">No Steam client · no game library · no account · works in launchers, emulators, non-Steam games, the desktop and the Windows lock screen.</text>
  </g>
</svg>
