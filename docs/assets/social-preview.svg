<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="SteamlessInput social preview card">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04091A"/><stop offset="55%" stop-color="#07152C"/><stop offset="100%" stop-color="#053149"/>
    </linearGradient>
    <linearGradient id="smark" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0A1A38"/><stop offset="100%" stop-color="#0A7FB0"/>
    </linearGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="75%" stop-color="#A7E7FF"/><stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8FD8FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>.t{font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect width="1280" height="640" fill="url(#sgrid)"/>
  <ellipse cx="640" cy="300" rx="560" ry="380" fill="url(#sglow)"/>

  <g transform="translate(508,72)">
    <circle cx="132" cy="132" r="132" fill="url(#smark)"/>
    <circle cx="132" cy="132" r="129" fill="none" stroke="#9FE3FF" stroke-opacity="0.35" stroke-width="3"/>
    <g transform="translate(132,132) scale(0.92) translate(-90,-90)">
      <mask id="spad" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="180">
        <path fill="#FFFFFF" d="M62 44h56a10 10 0 0 1 8 4h18a10 10 0 0 1 8-4h6c9 0 15 6 18 15 8 24 14 49 15 72 1 16-7 27-20 27-9 0-15-5-19-15l-5-13a12 12 0 0 0-11-8H74a12 12 0 0 0-11 8l-5 13c-4 10-10 15-19 15-13 0-21-11-20-27 1-23 7-48 15-72 3-9 9-15 18-15z"/>
        <g fill="#000000">
          <rect x="59" y="60" width="8" height="26" rx="2"/><rect x="50" y="69" width="26" height="8" rx="2"/>
          <circle cx="122" cy="62" r="5"/><circle cx="136" cy="72" r="5"/><circle cx="108" cy="72" r="5"/><circle cx="122" cy="82" r="5"/>
          <rect x="66" y="104" width="24" height="24" rx="6" transform="rotate(-10 78 116)"/>
          <rect x="104" y="104" width="24" height="24" rx="6" transform="rotate(10 116 116)"/>
        </g>
      </mask>
      <rect x="0" y="0" width="180" height="180" fill="#FFFFFF" mask="url(#spad)"/>
    </g>
  </g>

  <text class="t" x="640" y="424" text-anchor="middle" font-size="76" font-weight="700" fill="url(#sword)" letter-spacing="-1.5">SteamlessInput</text>
  <text class="t" x="640" y="470" text-anchor="middle" font-size="25" fill="#C3D6EE">An open-source, easier-to-use Steam Input</text>
  <text class="t" x="640" y="508" text-anchor="middle" font-size="22" fill="#7FD3F7">Any gamepad becomes a Steam Controller — without Steam running</text>

  <g class="t" font-size="16" font-weight="600" fill="#BEE9FF" text-anchor="middle">
    <g transform="translate(340,548)"><rect width="180" height="40" rx="20" fill="#0A7FB0" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5"/><text x="90" y="26">On-screen keyboard</text></g>
    <g transform="translate(536,548)"><rect width="180" height="40" rx="20" fill="#0A7FB0" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5"/><text x="90" y="26">Trackpad gestures</text></g>
    <g transform="translate(732,548)"><rect width="180" height="40" rx="20" fill="#0A7FB0" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5"/><text x="90" y="26">Gamepad mode</text></g>
  </g>

  <text class="t" x="640" y="618" text-anchor="middle" font-size="14" fill="#6B84A4">Windows &amp; Linux · GPL-3.0 · github.com/PietPetGit/SteamlessInput</text>
</svg>
