<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-label="SteamlessInput compared with Steam Input">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/><stop offset="100%" stop-color="#051D33"/>
    </linearGradient>
    <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A7FB0" stop-opacity="0.30"/><stop offset="100%" stop-color="#0A7FB0" stop-opacity="0.06"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .row { font-size: 15px; fill: #DCE9F8; }
      .y { font-size: 15px; fill: #4ADE80; }
      .n { font-size: 15px; fill: #F87171; }
      .m { font-size: 15px; fill: #FBBF24; }
    </style>
  </defs>

  <rect width="1080" height="560" rx="18" fill="url(#vbg)"/>
  <rect x="0.5" y="0.5" width="1079" height="559" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>

  <text class="t" x="40" y="54" font-size="27" font-weight="700" fill="#FFFFFF">Not a replacement — a different trade-off</text>
  <text class="t" x="40" y="80" font-size="14" fill="#8FA3BF">Steam Input is great. This is the slimmed-down, experiment-friendly take that runs without it.</text>

  <!-- column highlight -->
  <rect x="600" y="100" width="220" height="424" rx="12" fill="url(#mine)" stroke="#38BDF8" stroke-opacity="0.45"/>

  <g class="t">
    <text x="700" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#7FD3F7">SteamlessInput</text>
    <text x="940" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#9FB4CE">Steam Input</text>
    <line x1="40" y1="146" x2="1040" y2="146" stroke="#38BDF8" stroke-opacity="0.3"/>
  </g>

  <g class="t">
    <g transform="translate(0,180)">
      <text class="row" x="40" y="0">Works with Steam closed</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔  always</text>
      <text class="n" x="940" y="0" text-anchor="middle">✘  needs Steam</text>
    </g>
    <g transform="translate(0,222)">
      <text class="row" x="40" y="0">Works in launchers, emulators, the desktop</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔</text>
      <text class="m" x="940" y="0" text-anchor="middle">partly (shortcuts)</text>
    </g>
    <g transform="translate(0,264)">
      <text class="row" x="40" y="0">Works on the Windows lock screen</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔  optional add-on</text>
      <text class="n" x="940" y="0" text-anchor="middle">✘</text>
    </g>
    <g transform="translate(0,306)">
      <text class="row" x="40" y="0">Settings you can drive from the couch</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔  one page</text>
      <text class="m" x="940" y="0" text-anchor="middle">deep menus</text>
    </g>
    <g transform="translate(0,348)">
      <text class="row" x="40" y="0">Separate XInput slot per controller</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔</text>
      <text class="m" x="940" y="0" text-anchor="middle">varies</text>
    </g>
    <g transform="translate(0,390)">
      <text class="row" x="40" y="0">Experimental gestures (pinch, scrub, swipe-type)</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔</text>
      <text class="n" x="940" y="0" text-anchor="middle">✘</text>
    </g>
    <g transform="translate(0,432)">
      <text class="row" x="40" y="0">TV / audio / HDR / sleep automation</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔</text>
      <text class="n" x="940" y="0" text-anchor="middle">✘</text>
    </g>
    <g transform="translate(0,474)">
      <text class="row" x="40" y="0">Imports community Steam Input layouts</text>
      <text class="y" x="700" y="0" text-anchor="middle">✔  SteamInputDB / .vdf</text>
      <text class="y" x="940" y="0" text-anchor="middle">✔  native</text>
    </g>

    <line x1="40" y1="200" x2="1040" y2="200" stroke="#38BDF8" stroke-opacity="0.10"/>
    <line x1="40" y1="242" x2="1040" y2="242" stroke="#38BDF8" stroke-opacity="0.10"/>
    <line x1="40" y1="284" x2="1040" y2="284" stroke="#38BDF8" stroke-opacity="0.10"/>
    <line x1="40" y1="326" x2="1040" y2="326" stroke="#38BDF8" stroke-opacity="0.10"/>
    <line x1="40" y1="368" x2="1040" y2="368" stroke="#38BDF8" stroke-opacity="0.10"/>
    <line x1="40" y1="410" x2="1040" y2="410" stroke="#38BDF8" stroke-opacity="0.10"/>
    <line x1="40" y1="452" x2="1040" y2="452" stroke="#38BDF8" stroke-opacity="0.10"/>
  </g>
</svg>
