<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Keyboard modes: split keyboard, swipe typing, hold for accents and the 75 percent layout">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/><stop offset="100%" stop-color="#06203A"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .h { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .b { font-size: 13px; fill: #9FB4CE; }
      .k { font-size: 11px; fill: #DCE9F8; }
      .key { fill: #16263F; stroke: #38BDF8; stroke-opacity: 0.28; }
      .keyhot { fill: #0A7FB0; fill-opacity: 0.55; stroke: #7FD3F7; }
      .trace { stroke: #38BDF8; stroke-width: 3; fill: none; stroke-linecap: round;
               stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw 3s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 320 } 45%,70% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -320 } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1280" height="520" rx="18" fill="url(#kbg)"/>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>
  <text class="t" x="44" y="52" font-size="27" font-weight="700" fill="#FFFFFF">Four ways to type</text>
  <text class="t" x="44" y="78" font-size="14" fill="#8FA3BF">All from the pad already in your hands — no wireless keyboard needed.</text>

  <!-- 1: Split keyboard -->
  <g transform="translate(44,110)">
    <rect width="286" height="368" rx="14" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text class="t h" x="20" y="36">Split Keyboard</text>
    <text class="t b" x="20" y="58">Two halves at the screen edges,</text>
    <text class="t b" x="20" y="76">one per trackpad.</text>

    <rect x="20" y="96" width="246" height="140" rx="8" fill="#050B18" stroke="#38BDF8" stroke-opacity="0.2"/>
    <g>
      <g fill="#16263F" stroke="#38BDF8" stroke-opacity="0.28">
        <rect x="28" y="150" width="20" height="18" rx="4"/><rect x="52" y="150" width="20" height="18" rx="4"/>
        <rect x="76" y="150" width="20" height="18" rx="4"/><rect x="100" y="150" width="20" height="18" rx="4"/>
        <rect x="32" y="172" width="20" height="18" rx="4"/><rect x="56" y="172" width="20" height="18" rx="4"/>
        <rect x="80" y="172" width="20" height="18" rx="4"/><rect x="104" y="172" width="20" height="18" rx="4"/>
        <rect x="36" y="194" width="20" height="18" rx="4"/><rect x="60" y="194" width="20" height="18" rx="4"/>
        <rect x="84" y="194" width="20" height="18" rx="4"/><rect x="108" y="194" width="20" height="18" rx="4"/>

        <rect x="162" y="150" width="20" height="18" rx="4"/><rect x="186" y="150" width="20" height="18" rx="4"/>
        <rect x="210" y="150" width="20" height="18" rx="4"/><rect x="234" y="150" width="20" height="18" rx="4"/>
        <rect x="158" y="172" width="20" height="18" rx="4"/><rect x="182" y="172" width="20" height="18" rx="4"/>
        <rect x="206" y="172" width="20" height="18" rx="4"/><rect x="230" y="172" width="20" height="18" rx="4"/>
        <rect x="154" y="194" width="20" height="18" rx="4"/><rect x="178" y="194" width="20" height="18" rx="4"/>
        <rect x="202" y="194" width="20" height="18" rx="4"/><rect x="226" y="194" width="20" height="18" rx="4"/>
      </g>
      <circle cx="66" cy="181" r="9" fill="#38BDF8" fill-opacity="0.5"/>
      <circle cx="196" cy="181" r="9" fill="#38BDF8" fill-opacity="0.5"/>
      <text class="t b" x="143" y="126" text-anchor="middle" fill="#7FD3F7" font-size="12">your screen</text>
    </g>

    <text class="t b" x="20" y="272" fill="#DCE9F8" font-size="14">Also:</text>
    <text class="t b" x="20" y="296">· Touch Typing</text>
    <text class="t b" x="20" y="318">· Release Touch To Type</text>
    <text class="t b" x="20" y="340">· Key Hit Assist &amp; Press To Focus Key</text>
  </g>

  <!-- 2: Swipe typing -->
  <g transform="translate(350,110)">
    <rect width="286" height="368" rx="14" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text class="t h" x="20" y="36">Swipe Typing</text>
    <text class="t b" x="20" y="58">Drag through the letters on the</text>
    <text class="t b" x="20" y="76">trackpad — it works out the word.</text>

    <g transform="translate(20,96)">
      <rect width="246" height="150" rx="8" fill="#050B18" stroke="#38BDF8" stroke-opacity="0.2"/>
      <g class="key">
        <rect x="16" y="22" width="26" height="26" rx="5"/><rect x="48" y="22" width="26" height="26" rx="5"/>
        <rect x="80" y="22" width="26" height="26" rx="5"/><rect x="112" y="22" width="26" height="26" rx="5"/>
        <rect x="144" y="22" width="26" height="26" rx="5"/><rect x="176" y="22" width="26" height="26" rx="5"/>
        <rect x="208" y="22" width="26" height="26" rx="5"/>
        <rect x="24" y="56" width="26" height="26" rx="5"/><rect x="56" y="56" width="26" height="26" rx="5"/>
        <rect x="88" y="56" width="26" height="26" rx="5"/><rect x="120" y="56" width="26" height="26" rx="5"/>
        <rect x="152" y="56" width="26" height="26" rx="5"/><rect x="184" y="56" width="26" height="26" rx="5"/>
        <rect x="40" y="90" width="26" height="26" rx="5"/><rect x="72" y="90" width="26" height="26" rx="5"/>
        <rect x="104" y="90" width="26" height="26" rx="5"/><rect x="136" y="90" width="26" height="26" rx="5"/>
        <rect x="168" y="90" width="26" height="26" rx="5"/>
      </g>
      <path fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round" d="M53 103 C 90 60, 120 40, 157 35 S 180 80, 197 69"/>
      <path class="trace" d="M53 103 C 90 60, 120 40, 157 35 S 180 80, 197 69"/>
      <text class="t k" x="123" y="138" text-anchor="middle" fill="#7FD3F7">t · y · p · e</text>
    </g>

    <g transform="translate(20,266)">
      <rect width="246" height="46" rx="8" fill="#050B18" stroke="#38BDF8" stroke-opacity="0.25"/>
      <text class="t" x="16" y="30" font-size="17" fill="#FFFFFF">typing<tspan class="cursor" fill="#38BDF8">▌</tspan></text>
    </g>
    <text class="t b" x="20" y="340">Gyro, sticks and mouse all drive it too.</text>
  </g>

  <!-- 3: Hold for accents -->
  <g transform="translate(656,110)">
    <rect width="286" height="368" rx="14" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text class="t h" x="20" y="36">Hold For Accents</text>
    <text class="t b" x="20" y="58">Hold a letter for a row of its</text>
    <text class="t b" x="20" y="76">accented forms — 25 languages.</text>

    <g transform="translate(20,110)">
      <g class="key"><rect x="0" y="60" width="40" height="40" rx="7"/></g>
      <text class="t" x="20" y="88" text-anchor="middle" font-size="19" fill="#FFFFFF">e</text>
      <g>
        <rect x="0" y="0" width="246" height="44" rx="8" fill="#0A7FB0" fill-opacity="0.22" stroke="#7FD3F7" stroke-opacity="0.6"/>
        <text class="t" x="123" y="30" text-anchor="middle" font-size="19" fill="#FFFFFF" letter-spacing="6">é è ê ë ē ė ę</text>
        <path d="M14 44 L20 56 L26 44 z" fill="#7FD3F7" fill-opacity="0.6"/>
      </g>
      <text class="t b" x="56" y="88">hold ▸ pick with the trackpad</text>
    </g>

    <text class="t b" x="20" y="272" fill="#DCE9F8" font-size="14">Layouts:</text>
    <text class="t b" x="20" y="296">· classic QWERTY</text>
    <text class="t b" x="20" y="318">· phone-style</text>
    <text class="t b" x="20" y="340">· 75% with F1–F12 and arrows</text>
  </g>

  <!-- 4: 75% layout -->
  <g transform="translate(962,110)">
    <rect width="274" height="368" rx="14" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text class="t h" x="20" y="36">75% board</text>
    <text class="t b" x="20" y="58">F-row, arrows, and a hold-and-drag</text>
    <text class="t b" x="20" y="76">Select key for text selection.</text>

    <g transform="translate(20,96)">
      <rect width="234" height="152" rx="8" fill="#050B18" stroke="#38BDF8" stroke-opacity="0.2"/>
      <g class="key">
        <rect x="12" y="14" width="16" height="12" rx="3"/><rect x="32" y="14" width="16" height="12" rx="3"/>
        <rect x="52" y="14" width="16" height="12" rx="3"/><rect x="72" y="14" width="16" height="12" rx="3"/>
        <rect x="92" y="14" width="16" height="12" rx="3"/><rect x="112" y="14" width="16" height="12" rx="3"/>
        <rect x="132" y="14" width="16" height="12" rx="3"/><rect x="152" y="14" width="16" height="12" rx="3"/>
        <rect x="172" y="14" width="16" height="12" rx="3"/><rect x="192" y="14" width="16" height="12" rx="3"/>
      </g>
      <g class="key">
        <rect x="12" y="34" width="176" height="18" rx="4"/>
        <rect x="12" y="58" width="176" height="18" rx="4"/>
        <rect x="12" y="82" width="176" height="18" rx="4"/>
        <rect x="12" y="106" width="120" height="18" rx="4"/>
      </g>
      <g class="keyhot"><rect x="140" y="106" width="48" height="18" rx="4"/></g>
      <text class="t k" x="164" y="119" text-anchor="middle">Select</text>
      <g class="key">
        <rect x="196" y="82" width="16" height="16" rx="3"/>
        <rect x="196" y="102" width="16" height="16" rx="3"/>
        <rect x="178" y="126" width="16" height="16" rx="3"/>
        <rect x="214" y="102" width="16" height="16" rx="3"/>
      </g>
    </g>

    <text class="t b" x="20" y="284" fill="#DCE9F8" font-size="14">Plus:</text>
    <text class="t b" x="20" y="308">· per-app keyboard memory</text>
    <text class="t b" x="20" y="330">· skins, key sounds, 4K/TV sizing</text>
    <text class="t b" x="20" y="352">· optional lock-screen keyboard</text>
  </g>
</svg>
