<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460" role="img" aria-label="Big Picture automation: what changes when Big Picture opens and how it all reverts on close">
  <defs>
    <linearGradient id="bpbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/><stop offset="100%" stop-color="#052033"/>
    </linearGradient>
    <marker id="bpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/>
    </marker>
    <style>
      .t { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .b { font-size: 14px; fill: #DCE9F8; }
      .s { font-size: 12.5px; fill: #8FA3BF; }
    </style>
  </defs>

  <rect width="1080" height="460" rx="18" fill="url(#bpbg)"/>
  <rect x="0.5" y="0.5" width="1079" height="459" rx="18" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>
  <text class="t" x="40" y="50" font-size="25" font-weight="700" fill="#FFFFFF">Your living room, automated</text>
  <text class="t" x="40" y="76" font-size="14" fill="#8FA3BF">Open Big Picture and the PC becomes a console. Close it and everything goes back exactly as it was.</text>

  <!-- open state -->
  <g transform="translate(40,104)">
    <rect width="470" height="316" rx="14" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.35"/>
    <rect width="470" height="3" rx="2" fill="#38BDF8"/>
    <text class="t" x="24" y="40" font-size="17" font-weight="700" fill="#7FD3F7">▶  Big Picture opens</text>
    <g class="t">
      <text class="b" x="24" y="80">🖥  Display switches to the TV</text>
      <text class="s" x="46" y="100">and back to the monitor afterwards</text>
      <text class="b" x="24" y="132">🔊  Audio output switches to the TV / receiver</text>
      <text class="s" x="46" y="152">your desktop device is remembered</text>
      <text class="b" x="24" y="184">✨  HDR turns on</text>
      <text class="s" x="46" y="204">per-display, only where it is supported</text>
      <text class="b" x="24" y="236">🌙  Night Light off, media paused, cursor hidden</text>
      <text class="s" x="46" y="256">manual or scheduled Night Light state is restored byte-exact</text>
      <text class="b" x="24" y="288">🎮  Opens or closes itself when a pad connects (Linux)</text>
    </g>
  </g>

  <!-- arrow -->
  <g>
    <path d="M524 236 H 566" stroke="#38BDF8" stroke-width="2" marker-end="url(#bpa)"/>
    <path d="M566 286 H 524" stroke="#38BDF8" stroke-width="2" marker-end="url(#bpa)" stroke-opacity="0.6"/>
    <text class="t s" x="545" y="228" text-anchor="middle" fill="#7FD3F7">open</text>
    <text class="t s" x="545" y="308" text-anchor="middle">close</text>
  </g>

  <!-- config state -->
  <g transform="translate(586,104)">
    <rect width="454" height="316" rx="14" fill="#0B1729" stroke="#38BDF8" stroke-opacity="0.35"/>
    <rect width="454" height="3" rx="2" fill="#0A7FB0"/>
    <text class="t" x="24" y="40" font-size="17" font-weight="700" fill="#7FD3F7">⚙  One page of toggles</text>
    <g class="t">
      <g transform="translate(24,64)">
        <rect width="406" height="40" rx="8" fill="#12233F"/>
        <text class="b" x="16" y="25">Launch Steam into Big Picture on boot</text>
        <g transform="translate(346,10)"><rect width="44" height="22" rx="11" fill="#38BDF8"/><circle cx="33" cy="11" r="9" fill="#04121F"/></g>
      </g>
      <g transform="translate(24,112)">
        <rect width="406" height="40" rx="8" fill="#12233F"/>
        <text class="b" x="16" y="25">Pause SteamlessInput while Steam runs</text>
        <g transform="translate(346,10)"><rect width="44" height="22" rx="11" fill="#38BDF8"/><circle cx="33" cy="11" r="9" fill="#04121F"/></g>
      </g>
      <g transform="translate(24,160)">
        <rect width="406" height="40" rx="8" fill="#12233F"/>
        <text class="b" x="16" y="25">Sleep Manager — keep the TV box awake</text>
        <g transform="translate(346,10)"><rect width="44" height="22" rx="11" fill="#38BDF8"/><circle cx="33" cy="11" r="9" fill="#04121F"/></g>
      </g>
      <g transform="translate(24,208)">
        <rect width="406" height="40" rx="8" fill="#12233F"/>
        <text class="b" x="16" y="25">Hide the cursor in Big Picture</text>
        <g transform="translate(346,10)"><rect width="44" height="22" rx="11" fill="#22384F"/><circle cx="11" cy="11" r="9" fill="#6E86A3"/></g>
      </g>
      <text class="s" x="24" y="278">Steam · Big Picture · Windows · Sleep Manager pages</text>
      <text class="s" x="24" y="296">configure the machine around the couch, not just the pad.</text>
    </g>
  </g>
</svg>
