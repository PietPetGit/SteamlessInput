name: Build release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows release package
    runs-on: windows-latest
    # Four PyInstaller passes now (app, lock-screen, relay, setup wizard).
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --prefer-binary -r requirements.txt

      # Build everything the setup wizard can offer. A component whose payload
      # isn't in the download shows as UNAVAILABLE and can never be installed,
      # so "what CI builds" is exactly "what users can tick".
      #   --with-installer  the wizard itself (NOT --bundle: it finds the app
      #                     beside itself inside the zip, so the download
      #                     doesn't carry the 28 MB app twice)
      #   --with-relay      the uiAccess input relay (~18 MB, ships in the zip)
      #   (no --skip-lockscreen) the lock-screen keyboard, which is 44 MB and
      #                     goes out as a SEPARATE add-on zip  see below.
      - name: Build Windows binaries
        working-directory: windows
        run: python build.py --with-installer --with-relay

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\SteamlessInput-windows | Out-Null
          Copy-Item -LiteralPath windows\dist\SteamlessInput-windows.exe -Destination release\SteamlessInput-windows\
          # The app is a PyInstaller --onedir build: the exe does nothing
          # without _internal\ beside it, so it travels in the same folder.
          Copy-Item -LiteralPath windows\dist\_internal -Destination release\SteamlessInput-windows\_internal -Recurse
          Copy-Item -LiteralPath windows\dist\SteamlessInput-Setup.exe -Destination release\SteamlessInput-windows\
          Copy-Item -LiteralPath windows\dist\SteamlessInput-Setup.cmd -Destination release\SteamlessInput-windows\
          Copy-Item -LiteralPath windows\dist\uia-relay -Destination release\SteamlessInput-windows\uia-relay -Recurse
          Copy-Item -LiteralPath README.md,LICENSE,THIRD_PARTY_NOTICES.md -Destination release\SteamlessInput-windows\
          Compress-Archive -Path release\SteamlessInput-windows -DestinationPath SteamlessInput-windows.zip -Force

      # The lock-screen keyboard is 44 MB and is the one component the project
      # actively recommends against. Keeping it out of the main download means
      # nobody pays for it by default; unzipping this beside the setup exe
      # makes the wizard offer it (that is what its "unavailable" text says).
      - name: Package lock-screen add-on
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\lockscreen-addon | Out-Null
          Copy-Item -LiteralPath windows\lockscreen-keyboard\LockScreenKeyboard.exe -Destination release\lockscreen-addon\
          Copy-Item -LiteralPath windows\lockscreen-keyboard\README.md,windows\lockscreen-keyboard\HOW-IT-WORKS.md -Destination release\lockscreen-addon\
          Copy-Item -LiteralPath windows\lockscreen-keyboard\install.bat,windows\lockscreen-keyboard\install.ps1,windows\lockscreen-keyboard\uninstall.bat,windows\lockscreen-keyboard\uninstall.ps1 -Destination release\lockscreen-addon\
          Compress-Archive -Path release\lockscreen-addon\* -DestinationPath SteamlessInput-lockscreen-addon.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamlessInput-windows
          path: SteamlessInput-windows.zip

      - name: Upload lock-screen add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamlessInput-lockscreen-addon
          path: SteamlessInput-lockscreen-addon.zip

      - name: Attach Windows artifacts to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SteamlessInput-windows.zip
            SteamlessInput-lockscreen-addon.zip

  linux:
    name: Linux release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            gobject-introspection \
            libayatana-appindicator3-1 \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgtk-3-0 \
            libhidapi-hidraw0 \
            libxkbcommon0 \
            pkg-config \
            python3-gi \
            python3-gi-cairo

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install --prefer-binary -r requirements.txt

      # The setup wizard goes INSIDE the tarball (build_linux.py builds it
      # before packing), so an unpacked release has the app and its installer
      # side by side  which is where the wizard looks for its payload.
      - name: Build Linux tarball
        working-directory: linux
        run: python build.py --with-installer

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamlessInput-linux
          path: linux/dist/SteamlessInput-linux.tar.gz

      - name: Attach Linux artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: linux/dist/SteamlessInput-linux.tar.gz
